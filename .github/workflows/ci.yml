name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nim-version: ['stable']

    steps:
      - uses: actions/checkout@v4

      - name: Cache choosenim (linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.choosenim
          key: ${{ runner.os }}-choosenim-${{ matrix.nim-version }}

      - name: Setup Nim (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -x "$HOME/.nimble/bin/choosenim" ]; then
            curl https://nim-lang.org/choosenim/init.sh -sSf | sh -s -- -y
          fi
          export PATH="$HOME/.nimble/bin:$PATH"
          choosenim -y "${{ matrix.nim-version }}"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          nim -v

      - name: Resolve Nim version (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${{ matrix.nim-version }}" = "stable" ]; then
            echo "NIM_VER=$(curl -sSL https://nim-lang.org/channels/stable)" >> "$GITHUB_ENV"
          else
            echo "NIM_VER=${{ matrix.nim-version }}" >> "$GITHUB_ENV"
          fi

      - name: Cache Nim (macos)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/nim-dist
          key: ${{ runner.os }}-nim-${{ env.NIM_VER }}

      - name: Setup Nim (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -x "$HOME/nim-dist/bin/nim" ]; then
            case "$(uname -m)" in
              arm64) SUFFIX="macosx_arm64" ;;
              *) SUFFIX="macosx_x64" ;;
            esac
            mkdir -p "$HOME/nim-dist"
            curl -sSL "https://nim-lang.org/download/nim-${NIM_VER}-${SUFFIX}.tar.xz" -o /tmp/nim-mac.tar.xz
            tar -xf /tmp/nim-mac.tar.xz -C "$HOME/nim-dist" --strip-components=1
            rm -f /tmp/nim-mac.tar.xz
          fi
          echo "$HOME/nim-dist/bin" >> "$GITHUB_PATH"
          "$HOME/nim-dist/bin/nim" -v

      - name: Setup Nim (windows)
        if: runner.os == 'Windows'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: nim r -p:. tests/test.nim

      - name: Run tests with SSL
        run: nim r -p:. -d:ssl tests/test.nim

      - name: Check Examples
        run: |
          nim check -p:. examples/httpclient/main.nim
          nim check -p:. examples/server/main.nim
          nim check -p:. examples/checker/main.nim
          nim check -p:. examples/chain/main.nim
          nim check -p:. examples/udp/main.nim
          nim check -p:. examples/bridge/main.nim
          nim check -p:. examples/rawsocket/main.nim
