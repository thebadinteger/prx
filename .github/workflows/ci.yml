name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nim-version: ['stable']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: nim r -p:. tests/test.nim

      - name: Run tests with SSL
        run: nim r -p:. -d:ssl tests/test.nim

      - name: Check Examples
        run: |
          nim check -p:. examples/httpclient/main.nim
          nim check -p:. examples/server/main.nim
          nim check -p:. examples/checker/main.nim
          nim check -p:. examples/chain/main.nim
          nim check -p:. examples/udp/main.nim
          nim check -p:. examples/bridge/main.nim
          nim check -p:. examples/rawsocket/main.nim
